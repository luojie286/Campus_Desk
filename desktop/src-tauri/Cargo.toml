[package]
name = "campus-desk"
version = "0.1.0"
description = "Campus message and approval workbench"
authors = ["luojie286"]
edition = "2021"

[lib]
name = "campus_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
