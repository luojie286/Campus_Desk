<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">Campus Desk · Review first. Then act.</title>
  <desc id="description">A personal campus assistant: organize QQ messages, review tasks on your phone, and approve spreadsheet edits on your computer. Development prototype.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e3eee5"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#245d4c" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#paper)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="52" y="43" width="38" height="38" rx="12" fill="#245d4c"/>
    <path d="M62 55h18M62 63h18M65 51v23m12-23v23" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="104" y="68" font-size="15" letter-spacing="3" fill="#3e6f5c">CAMPUS DESK</text>
    <text x="49" y="175" font-size="64" font-weight="700" fill="#173f32">Campus Desk</text>
    <text x="54" y="229" font-size="32" font-weight="600" fill="#245d4c">Review first. Then act.</text>
    <text x="54" y="272" font-size="18" fill="#587264">Turn group updates into tasks. Approve every edit.</text>
    <g font-size="13" fill="#3b6252">
      <rect x="54" y="317" width="110" height="30" rx="15" fill="#fff" fill-opacity=".75"/><text x="75" y="337">Android 0.5.0</text>
      <rect x="174" y="317" width="92" height="30" rx="15" fill="#fff" fill-opacity=".75"/><text x="194" y="337">Local-first</text>
      <rect x="276" y="317" width="92" height="30" rx="15" fill="#fff" fill-opacity=".75"/><text x="296" y="337">Approval</text>
      <rect x="378" y="317" width="92" height="30" rx="15" fill="#fff" fill-opacity=".75"/><text x="398" y="337">Prototype</text>
    </g>
    <path d="M958 106v181" stroke="#b5ccba" stroke-width="2" stroke-dasharray="4 6"/>
    <g transform="translate(760 49)">
      <rect x="0" y="5" width="444" height="76" rx="18" fill="#245d4c" fill-opacity=".06"/>
      <rect width="444" height="76" rx="18" fill="#fff" stroke="#d2e1d3"/>
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#eef3ed"/>
      <path d="M30 31h16m-16 7h12m-12 7h9" stroke="#3f7c63" stroke-width="2" stroke-linecap="round"/>
      <text x="75" y="32" font-size="14" fill="#6a7d70">01 / ORGANIZE</text>
      <text x="75" y="56" font-size="18" font-weight="600" fill="#244c3a">Merge updates into one clear task</text>
    </g>
    <g transform="translate(724 157)">
      <rect x="0" y="5" width="444" height="76" rx="18" fill="#245d4c" fill-opacity=".06"/>
      <rect width="444" height="76" rx="18" fill="#fff" stroke="#d2e1d3"/>
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#eef3ed"/>
      <path d="m29 37 6 6 13-14" stroke="#3f7c63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="32" font-size="14" fill="#6a7d70">02 / REVIEW</text>
      <text x="75" y="56" font-size="18" font-weight="600" fill="#244c3a">Keep tasks. Review every planned edit.</text>
    </g>
    <g transform="translate(760 265)">
      <rect x="0" y="5" width="444" height="76" rx="18" fill="#245d4c" fill-opacity=".06"/>
      <rect width="444" height="76" rx="18" fill="#245d4c"/>
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#fff" fill-opacity=".12"/>
      <path d="M29 28h18v20H29zm0 7h18m-12-7v20" fill="none" stroke="#d8ebd8" stroke-width="1.8"/>
      <text x="75" y="32" font-size="14" fill="#bdd7bf">03 / EXECUTE</text>
      <text x="75" y="56" font-size="18" font-weight="600" fill="#fff">Fill approved cells. Read back to verify.</text>
    </g>
    <text x="1204" y="377" text-anchor="end" font-size="11" fill="#73917c" letter-spacing="1">QQ → TASKS / PLANS → APPROVAL → VERIFICATION</text>
  </g>
</svg>
